name: C++ build and run
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure CMake
        run: cmake -S . -B build
      - name: Build
        run: cmake --build build --parallel
      - name: Run self-checks and demo
        run: |
          rm -f incidents.bin
          ./build/early_warning_grid
